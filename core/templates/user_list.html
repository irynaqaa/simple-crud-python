<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User List</title>
    <!-- Optional Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
</head>
<body>
    <h1>User List</h1>
    <a href="{{ url_for('user_bp.add_user') }}">Add New User</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% if users %}
            {% for user in users %}
                <tr>
                    <td>{{ user.name | e }}</td>
                    <td>{{ user.age }}</td>
                    <td>{{ user.email | e }}</td>
                    <td>
                        <a href="{{ url_for('user_bp.edit_user', id=user.id) }}">Edit</a> |
                        <a href="{{ url_for('user_bp.delete_user', id=user.id) }}">Delete</a>
                    </td>
                </tr>
            {% endfor %}
        {% else %}
            <tr>
                <td colspan="4">No users found.</td>
            </tr>
        {% endif %}
        </tbody>
    </table>
</body>
</html>
