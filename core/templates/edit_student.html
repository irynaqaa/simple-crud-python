{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Student</h2>

    {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('students.edit_student', id=student.id) }}">
        <div class="form-group">
            <label for="nama">Nama</label>
            <input type="text" class="form-control" id="nama" name="nama"
                   value="{{ request.form.get('nama', student.nama) }}">
        </div>
        <div class="form-group">
            <label for="kelas">Kelas</label>
            <input type="text" class="form-control" id="kelas" name="kelas"
                   value="{{ request.form.get('kelas', student.kelas) }}">
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('students.list') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
